# Full Playwright E2E suite against an ephemeral Supabase stack.
#
# The suite is self-provisioning: playwright.config.ts's globalSetup starts
# the gtb_e2e Supabase stack (via the `supabase` CLI pinned in @gtb/e2e's
# devDependencies), migrates + seeds the database, creates per-role users,
# then Playwright boots the API (:3105) and web (:5185) dev servers itself.
name: E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @gtb/e2e exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 14
      - name: Upload traces & failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: apps/e2e/test-results
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          echo "## E2E results" >> "$GITHUB_STEP_SUMMARY"
          if [ -f apps/e2e/test-results/junit.xml ]; then
            node -e '
              const fs = require("fs");
              const xml = fs.readFileSync("apps/e2e/test-results/junit.xml", "utf8");
              const num = (name) => [...xml.matchAll(new RegExp(name + "=\"(\\\\d+)\"", "g"))].reduce((a, m) => a + Number(m[1]), 0);
              const tests = num("tests"), failures = num("failures"), skipped = num("skipped");
              console.log(`| Total | Passed | Failed | Skipped |`);
              console.log(`|---|---|---|---|`);
              console.log(`| ${tests} | ${tests - failures - skipped} | ${failures} | ${skipped} |`);
            ' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "junit.xml missing — the run failed before reporting." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Full HTML report (screenshots, videos, traces) is in the **playwright-report** artifact." >> "$GITHUB_STEP_SUMMARY"
