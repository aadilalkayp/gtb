# PR gate: typecheck + lint + both production builds. No deploys here.
name: CI

on:
  pull_request:
  workflow_call: # reused as the check stage of deploy.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm -r typecheck
      - run: pnpm lint
        continue-on-error: true # pre-existing lint debt; tighten once cleaned up
      - name: Build web
        run: pnpm --filter @gtb/web build
        env:
          VITE_API_URL: https://placeholder.invalid
          VITE_SUPABASE_URL: https://placeholder.invalid
          VITE_SUPABASE_ANON_KEY: placeholder
      # next build forces NODE_ENV=production and apps/api/src/lib/env.ts
      # validates eagerly while collecting page data — placeholders only, the
      # server re-reads process.env at boot (same trick as deploy/Dockerfile).
      - name: Build api
        run: pnpm --filter @gtb/api build
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          SUPABASE_URL: http://localhost:54321
          SUPABASE_ANON_KEY: build-placeholder
          SUPABASE_SERVICE_ROLE_KEY: build-placeholder
          WEB_ORIGIN: https://localhost
