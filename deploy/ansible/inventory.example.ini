# Copy to inventory.ini (gitignored) and fill in your VPS.
#
# First run against a FRESH box (still root) — must be -e, NOT -u: the
# ansible_user set below overrides the -u flag in Ansible's precedence order,
# and only extra-vars outrank inventory:
#   ansible-playbook site.yml -e ansible_user=root
# Every run after (root login is disabled by the playbook):
#   ansible-playbook site.yml
[gtb]
your-vps-ip-or-hostname ansible_user=admin
