# GTB OS API on the VPS. Installed to /opt/gtb/compose.yml by the Ansible
# playbook (deploy/ansible). CI rolls new versions by writing GTB_IMAGE_TAG to
# /opt/gtb/.env and running `docker compose pull && up -d`.
#
# GTB_IMAGE is set once in /opt/gtb/.env by Ansible (ghcr.io/<owner>/<repo>/gtb-api).
# Runtime secrets live in /opt/gtb/gtb-api.env (root:deploy 0640), never in the image.
services:
  api:
    image: "${GTB_IMAGE:?set in /opt/gtb/.env}:${GTB_IMAGE_TAG:-latest}"
    container_name: gtb-api
    restart: unless-stopped
    env_file: gtb-api.env
    # Only nginx on the host may reach it — never exposed to the network.
    ports:
      - "127.0.0.1:3001:3001"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
