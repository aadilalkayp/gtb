# Supabase stack dedicated to the Playwright E2E suite.
#
# Fully isolated from the dev stack in /supabase (project_id "gtb", ports
# 544xx): this one is project_id "gtb_e2e" on ports 545xx, so `pnpm e2e` can
# wipe and reseed its database on every run without ever touching dev data.
#
# Start/stop via the e2e scripts (they use the pinned `supabase` npm CLI):
#   pnpm --filter @gtb/e2e stack:start
#   pnpm --filter @gtb/e2e stack:stop
project_id = "gtb_e2e"

[api]
enabled = true
port = 54521
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54522
shadow_port = 54523
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
# No humans browse this stack; skip the Studio container for faster startup.
enabled = false

[inbucket]
# Captures invite/notification emails so tests can assert on them.
enabled = true
port = 54525

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false

[edge_runtime]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5185"
additional_redirect_urls = ["http://localhost:5185", "http://localhost:5185/portal/register"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.rate_limit]
# Generous limits: the suite signs in many times per run from one IP.
email_sent = 100
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 500

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
